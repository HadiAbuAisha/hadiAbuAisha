<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-label="Hadi Abu Aisha — Software Development and Cybersecurity">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#091426"/>
      <stop offset="58%" stop-color="#122a4b"/>
      <stop offset="100%" stop-color="#123b51"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#45e1d5"/>
      <stop offset="100%" stop-color="#73a7ff"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#9ac3f8" stroke-width="0.7" opacity="0.12"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="1200" height="330" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="330" rx="20" fill="url(#grid)"/>
  <circle cx="1020" cy="35" r="145" fill="#35d6df" opacity="0.12" filter="url(#glow)"/>
  <circle cx="790" cy="305" r="120" fill="#6c8bff" opacity="0.10" filter="url(#glow)"/>
  <rect x="53" y="54" width="5" height="219" rx="2.5" fill="url(#accent)"/>
  <text x="86" y="91" font-family="Arial,Helvetica,sans-serif" fill="#65e0db" font-size="17" font-weight="700" letter-spacing="4">HELLO, I'M</text>
  <text x="84" y="155" font-family="Arial,Helvetica,sans-serif" fill="#f6faff" font-size="54" font-weight="800" letter-spacing="1">HADI ABU AISHA</text>
  <rect x="85" y="181" width="410" height="2" fill="url(#accent)" opacity="0.9"/>
  <text x="85" y="218" font-family="Arial,Helvetica,sans-serif" fill="#c5d9f2" font-size="21">Web Development  /  Cybersecurity</text>
  <text x="85" y="264" font-family="Arial,Helvetica,sans-serif" fill="#8aa9c9" font-size="17">Building useful software. Learning to secure it.</text>
  <g transform="translate(780 57)">
    <rect width="351" height="222" rx="16" fill="#08172b" stroke="#37627d" stroke-width="1.5"/>
    <path d="M 0 16 Q 0 0 16 0 L 335 0 Q 351 0 351 16 L 351 41 L 0 41 Z" fill="#173451"/>
    <circle cx="25" cy="20" r="6" fill="#fb7884"/>
    <circle cx="46" cy="20" r="6" fill="#f9c768"/>
    <circle cx="67" cy="20" r="6" fill="#48d6b7"/>
    <text x="24" y="81" font-family="Courier New,monospace" font-size="15" fill="#64e4d1">$ whoami</text>
    <text x="24" y="111" font-family="Courier New,monospace" font-size="17" fill="#f4f8ff">hadi_abu_aisha</text>
    <text x="24" y="149" font-family="Courier New,monospace" font-size="14" fill="#8baac8">// build  ·  learn  ·  secure</text>
    <text x="24" y="181" font-family="Courier New,monospace" font-size="15" fill="#70aaff">&gt; keep_learning();</text>
    <rect x="215" y="170" width="9" height="17" fill="#70aaff" opacity="0.85"/>
